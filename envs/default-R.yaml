name: default-R_env
# This environment is used for R-based data analysis and visualization tasks.
channels:
  - conda-forge
  - defaults
  - bioconda
  - R
dependencies:
  - r-base==4.3.2
  - r-ggplot2
  - r-dplyr
  - r-tidyverse
  - r-ggrepel
  - r-ggpubr
  - r-ggthemes
  - r-data.table
  - r-furrr
  - r-irlba
  - r-rhpcblasctl
  - bioconda::bioconductor-biostrings
  - r-stringdist
  - r-feather
  - r-mltools
  - bioconda::bioconductor-msa
  - r-resample
  - r-optparse
  - r-RColorBrewer
  - bioconda::bioconductor-complexheatmap
  - r-dbscan
  - r-umap
  - r-fossil
  - r-seqinr
  - r-arrow